aid: vopay
url: https://raw.githubusercontent.com/api-evangelist/vopay/refs/heads/main/apis.yml
name: VoPay
kind: company
description: VoPay is a Vancouver, Canada based fintech offering an API-first embedded finance and payments-as-a-service
  platform that lets software companies, marketplaces, lenders, and enterprises move money across Canadian and North
  American bank rails from a single set of REST endpoints. Its Fintech-as-a-Service suite spans EFT, Interac e-Transfer,
  ACH, RTP/FedNow/FedWire, VoPay Instant, card and digital-wallet payments, cross-border and global cash management,
  virtual accounts, ledgering, scheduled and recurring payments, bank-account verification (IQ11), KYC/AML onboarding,
  and dispute management. VoPay ships a genuine public developer portal (docs.vopay.com) with a sandbox, an OpenAPI-backed
  API reference segmented by product, webhooks for transaction and account events, and API-key-plus-shared-secret
  signature authentication with IP whitelisting. Its home market is Canada, where it operates as an API-native money-movement
  layer over Interac and Payments Canada rails.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Canada
- Embedded Finance
- Payments as a Service
- Account-to-Account
- EFT
- Interac e-Transfer
- ACH
- Real-Time Payments
- Cross-Border
- Money Transfer
