              - EndingAfterPayments
              - Description
              - FirstName
              - LastName
              - CompanyName
              - Address1
              - City
              - Province
              - Country
              - PostalCode
              - AccountNumber
              - FinancialInstitutionNumber
              - BranchTransitNumber
              - Currency
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
