                  type: string
                ClientAccountID:
                  description: Client Account ID
                  type: string
                Amount:
                  description: The amount to schedule in the transactions
                  type: number
                Frequency:
                  description: 'The frequency of the scheduled transaction: single or recurring.'
                  type: string
