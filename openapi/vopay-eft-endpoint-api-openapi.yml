                    example: '2000'
                  LastModified:
                    type: string
                    format: date-time
                    description: This timestamp indicates when the transaction record was last modified. In normal circumstances withdraw transaction record will not be modified.
                    example: '2019-11-03 01:00:00'
                  CompanyName*:
                    type: string
                    description: Company's name
                    example: VoPay
                  FirstName*:
                    type: string
                    description: Recipient's first name
                    example: John
                  LastName:
                    type: string
                    description: Recipient's last name
                    example: Doe
                  Address1:
                    type: string
                    description: Recipient's address line 1
                    example: 112 Bentall Street
                  Address2:
                    type: string
                    description: Recipient's address line 2
                    example: ''
                  City:
                    type: string
                    description: Recipient's city
                    example: Vancouver
                  Province:
                    type: string
                    description: Recipient's province specified using two character abbreviation (eg. BC, AB)
                    example: BC
                  Country:
                    type: string
                    description: Recipient's country specified using full country name.
                    example: Canada
                  PostalCode:
                    type: string
                    description: Recipient's postal code.
                    example: V2W 4V6
                  FinancialInstitutionNumber:
                    type: string
                    description: Three digit institution number for a Canadian bank.
                    example: '112'
                  BranchTransitNumber:
                    type: string
                    description: Transit number for the customer's account.
                    example: '11809'
                  AccountNumber:
                    type: string
                    description: Recipient's bank account number that funds were deposited to.
                    example: '227654387'
                  ClientReferenceNumber:
                    type: string
                    description: An optional reference number which was associated with the transaction.
                    example: ''
                  TransactionTypeCode:
                    type: string
                    description: CPA transaction code.
                    example: '999'
                  PayLinkDetails:
                    type: object
                    description: 'Array serialized as a JSON object (JSON_FORCE_OBJECT): numeric string keys ''0'',''1'',... Collection of TransactionInfo data'
                    properties:
                      '0':
                        type: object
                        properties:
                          FirstName:
                            type: string
                            description: Customer's first name
                            example: John
                          LastName:
                            type: string
                            description: Customer's last name
                            example: Doe
                          EmailAddress:
                            type: string
                            description: Recipient's email address.
                            example: john.doe@vopay.com
                          InvoiceNumber:
                            type: string
                            description: Invoice number
                            example: ABC1234
                          Note:
                            type: string
                            description: If applicable, notes giving context to the transaction.
                            example: Paylink requested to the client 123
                          SenderName:
                            type: string
                            description: Sender's full name.
                            example: John Doe
                          PayLinkStatus:
                            type: string
                            description: Status of the Paylink request
                            example: pending
                          FailureReason:
                            type: string
                            description: Detailed description of why the paylink request failed.
                            example: ''
                          PayLinkCreated:
                            type: string
                            format: date
                            description: ''
                            example: '2019-11-03 01:00:00'
                        required:
                        - FirstName
                        - LastName
                        - EmailAddress
                        - InvoiceNumber
                        - Note
                        - SenderName
                        - PayLinkStatus
                        - FailureReason
                        - PayLinkCreated
                    x-empty-when: no pay-link details
                    x-list-of: inline
                  GLCode:
                    type: string
                    description: General ledger code.
                    example: '4300'
                required:
                - Success
                - ErrorMessage
                - TransactionID
                - TransactionStatus
                - TransactionDateTime
                - Amount
                - Currency
                - HoldAmount
                - LastModified
                - CompanyName*
                - FirstName*
                - LastName
                - Address1
                - Address2
                - City
                - Province
                - Country
                - PostalCode
                - FinancialInstitutionNumber
                - BranchTransitNumber
                - AccountNumber
