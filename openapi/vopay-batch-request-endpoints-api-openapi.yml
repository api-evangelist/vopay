                    type: boolean
                    description: True if the sending was successful, false if it failed
                    example: true
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  BatchDetails:
                    type: object
                    description: 'Array serialized as a JSON object (JSON_FORCE_OBJECT): numeric string keys ''0'',''1'',... Array of objects. Each object contains the details of each transaction in the batch transaction request.'
                    properties:
                      '0':
                        type: object
                        properties:
                          BatchTransactionRequestDetailsRecordID:
                            type: integer
