  /scheduled-payment/cancel:
    post:
      description: Cancel a scheduled payment and all its future occurrences.
      summary: Cancel Scheduled Payment
      tags:
      - Scheduled Payments
      operationId: ScheduledPaymentCancelPOST
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                ScheduledPaymentsID:
                  description: The ID of the scheduled payment to cancel
                  type: integer
              required:
              - AccountID
              - Key
              - Signature
              - ScheduledPaymentsID
        required: true
      responses:
        '200':
          description: Scheduled payment cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: Indicates whether the cancellation was successful
                  ErrorMessage:
                    type: string
                    description: Error message if the cancellation failed
                  Status:
                    type: string
                    enum:
                    - cancelled
                    description: The status of the scheduled payment
  /scheduled-payment/upcoming-payment/cancel:
    post:
      description: Cancel a single upcoming scheduled payment without affecting other occurrences.
      summary: Cancel Upcoming Payment
      tags:
      - Scheduled Payments
      operationId: UpcomingPaymentCancelPOST
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                ScheduledPaymentDetailsID:
                  description: The ID of the specific upcoming payment to cancel
                  type: integer
              required:
              - AccountID
              - Key
              - Signature
              - ScheduledPaymentDetailsID
        required: true
      responses:
        '200':
          description: Upcoming payment cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: Indicates whether the cancellation was successful
                  ErrorMessage:
                    type: string
                    description: Error message if the cancellation failed
                  Status:
                    type: string
                    enum:
                    - cancelled
                    description: The status of the upcoming payment
  /scheduled-payment/edit:
    post:
      description: Modify a scheduled payment by updating the amount. This affects all upcoming occurrences of the scheduled payment.
      summary: Edit Scheduled Payment
      tags:
      - Scheduled Payments
      operationId: ScheduledPaymentEditPOST
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                ScheduledPaymentsID:
                  description: The ID of the scheduled payment to edit
                  type: integer
                Amount:
                  description: The new transaction amount
                  type: number
              required:
              - AccountID
              - Key
              - Signature
              - ScheduledPaymentsID
              - Amount
        required: true
      responses:
        '200':
          description: Scheduled payment edited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: Indicates whether the edit was successful
                  ErrorMessage:
                    type: string
                    description: Error message if the edit failed
  /scheduled-payment/upcoming-payment/edit:
    post:
      description: Modify a single upcoming scheduled payment by updating the amount and/or date. This only affects the specific upcoming occurrence.
      summary: Edit Upcoming Payment
      tags:
      - Scheduled Payments
      operationId: UpcomingPaymentEditPOST
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                ScheduledPaymentDetailsID:
                  description: The ID of the specific upcoming payment to edit
                  type: integer
                Amount:
                  description: The new transaction amount. If omitted, amount remains unchanged.
                  type: number
                Date:
                  description: The new payment date and time. If omitted, date remains unchanged.
                  type: string
                  format: date-time
              required:
              - AccountID
              - Key
              - Signature
              - ScheduledPaymentDetailsID
        required: true
      responses:
        '200':
          description: Upcoming payment edited successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: Indicates whether the edit was successful
                  ErrorMessage:
                    type: string
                    description: Error message if the edit failed
