                          FailureReason:
                            type: string
                            description: The reason for failure, if any
                            example: ''
                          GLCode:
                            type: string
                            description: General ledger code.
                            example: '4300'
                          TransactionTypeCode:
                            type: string
                            description: CPA transaction code.
                            example: '999'
