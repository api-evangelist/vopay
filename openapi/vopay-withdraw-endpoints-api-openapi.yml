                            example: ''
                          SenderLastName:
                            type: string
                            description: The sender's last name
                            example: ''
                          SenderAddress1:
                            type: string
                            description: The sender's address line 1
                            example: 123 Main Street
                          SenderAddress2:
                            type: string
                            description: The sender's address line 2
                            example: ''
                          SenderAddressCity:
                            type: string
                            description: The sender's city
                            example: Vancouver
                          SenderAddressPostalCode:
                            type: string
                            description: The sender's postal code
                            example: V6G3G9
                          SenderAddressCountry:
                            type: string
                            description: The sender's country
                            example: Canada
                          SenderAddressProvince:
                            type: string
                            description: The sender's province
                            example: British Columbia
                          SenderEmailAddress:
                            type: string
                            description: The sender's email address
                            example: fist.last@vopay.com
                          RecipientFirstName:
                            type: string
                            description: The recipient's first name
                            example: John
                          RecipientLastName:
                            type: string
                            description: The recipient's last name
                            example: Doe
                          RecipientAddress1:
                            type: string
                            description: The recipient's address line 1
                            example: Severodvinskaya ulitsa, 14
                          RecipientAddress2:
                            type: string
                            description: The recipient's address line 2
                            example: ''
                          RecipientAddressCity:
                            type: string
                            description: The recipient's city
                            example: Mockba
                          RecipientAddressPostalCode:
                            type: string
                            description: The recipient's postal code
                            example: '127224'
                          RecipientAddressCountry:
                            type: string
                            description: The recipient's country
                            example: United States
                          RecipientAddressProvince:
                            type: string
                            description: The recipient's province
                            example: British Columbia
                          RecipientPhone:
                            type: string
                            description: The recipient's phone number
                            example: ''
                          RecipientEmailAddress:
                            type: string
                            description: The recipient's email address
                            example: john.doe@gmail.com
                          RecipientNationality:
                            type: string
                            description: The recipient's nationality
                            example: AUS
                          RecipientBusinessName:
                            type: string
