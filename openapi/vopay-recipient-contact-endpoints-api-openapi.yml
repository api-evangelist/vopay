                  type: string
                BusinessName:
                  description: Full legal business name of the recipient. Must be 2-60 characters and contain at least one letter. No abbreviations except standard suffixes (e.g. LLC, Ltd.).
                  type: string
                FirstName:
                  description: First name of the individual recipient. Must be 2-60 characters using only letters, spaces, commas, apostrophes, hyphens, and dots. No initials, acronyms, or company identifiers.
                  type: string
                LastName:
                  description: Last name of the individual recipient. Must be 2-60 characters using only letters, spaces, commas, apostrophes, hyphens, and dots. No initials, acronyms, or company identifiers.
                  type: string
                PhoneNumber:
                  description: Phone number of the recipient. Digits only, 9-15 characters. No spaces or hyphens (e.g. 19998887777).
                  type: string
                Address1:
                  description: Street address of the recipient. Must include a street name (e.g. 20 Longleat Drive). Numbers only are not accepted.
                  type: string
                Address2:
                  description: The second address line of the recipient contact
                  type: string
                City:
                  description: City of the recipient's address.
                  type: string
                Province:
                  description: The province of the address
                  type: string
                PostalCode:
                  description: The postal code of the address
                  type: string
                Country:
                  description: Country of the recipient's address. Accepts full country name or ISO 3166-1 alpha-2 or alpha-3 code. Sanctioned countries are not accepted.
                  type: string
                DateOfBirth:
                  description: Date of birth of the recipient in YYYY-MM-DD format (e.g. 1990-01-31).
                  type: string
                Nationality:
                  description: The nationality specified using full country name or ISO 3166-1 alpha-2 or ISO 3166-1 alpha-3 code.
                  type: string
                SourceOfIncome:
                  description: The source of income of the recipient contact
                  type: string
                Occupation:
                  description: The occupation of the recipient contact
                  type: string
                RelationshipWithBeneficiary:
                  description: The sender's relationship to the recipient contact
                  type: string
              required:
              - AccountID
              - Key
              - Signature
              - RecipientContactID
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: 'true'
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  RecipientContactID:
                    type: integer
                    description: The unique ID of the new recipient contact.
                    example: test_recipient_contact
  /gcm/recipient-contacts/favorites/add:
    post:
      description: Add a recipient to your favorites.
      summary: gcm/recipient-contacts/favorites/add
      tags:
      - Recipient Contact Endpoints
      operationId: RecipientContactsFavoritesAddPOST
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                RecipientContactID:
                  description: The recipient that will be favorited
                  type: string
                ClientAccountID:
                  description: The client account the favorite will be added to
                  type: string
              required:
              - AccountID
              - Key
              - Signature
              - RecipientContactID
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: 'true'
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  RecipientContactID:
                    type: integer
                    description: The unique ID of the new recipient contact.
                    example: test_recipient_contact
  /gcm/recipient-contacts/favorites/delete:
    post:
      description: Delete a recipient from your favorites.
      summary: gcm/recipient-contacts/favorites/delete
      tags:
      - Recipient Contact Endpoints
      operationId: RecipientContactsFavoritesDeletePOST
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                RecipientContactID:
                  description: The recipient that will be removed from favorites
                  type: string
                ClientAccountID:
                  description: The client account the favorite will be removed from
                  type: string
              required:
              - AccountID
              - Key
              - Signature
              - RecipientContactID
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: 'true'
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  RecipientContactID:
                    type: integer
                    description: The unique ID of the new recipient contact.
                    example: test_recipient_contact
