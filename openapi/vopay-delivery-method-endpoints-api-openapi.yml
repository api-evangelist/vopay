      - name: Key
        in: query
        required: true
        description: API key for the account
        schema:
          type: string
      - name: Signature
        in: query
        required: true
        description: Hashed signature for the request
        schema:
          type: string
      - name: DeliveryMethodToken
        in: query
        required: true
        description: The token of the delivery method to be edited
        schema:
          type: string
      - name: AccountType
        in: query
        required: false
        description: The account type
        schema:
          type: string
      - name: BankAccountNumber
        in: query
        required: false
        description: The bank account number
        schema:
          type: string
      - name: BankIdentifierCode
        in: query
        required: false
        description: The bank identifier code
        schema:
          type: string
      - name: InternationalBankAccountNumber
        in: query
        required: false
        description: The international bank account number
        schema:
          type: string
      - name: EWalletID
        in: query
        required: false
        description: The e-wallet ID
        schema:
          type: string
      - name: ServiceProvider
        in: query
        required: false
        description: The service provider
        schema:
          type: string
      - name: TelephoneNumber
        in: query
        required: false
        description: The telephone number
        schema:
          type: string
      - name: BankName
        in: query
        required: false
        description: The bank name
        schema:
          type: string
      - name: BankCode
        in: query
        required: false
        description: The bank code
        schema:
          type: string
      - name: BranchName
        in: query
        required: false
        description: The branch name
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: 'true'
                  ErrorMessage:
                    type: string
                    description: Error message if any
                    example: ''
  /gcm/delivery-methods/delete:
    post:
      description: Delete a delivery method for a certain recipient contact.
      summary: gcm/delivery-methods/delete
      tags:
      - Delivery Method Endpoints
      operationId: DeleteDeliveryMethodPOST
      deprecated: false
      parameters:
      - name: AccountID
        in: query
        required: true
        description: Your account ID
        schema:
          type: string
      - name: Key
        in: query
        required: true
        description: API key for the account
        schema:
          type: string
      - name: Signature
        in: query
        required: true
        description: Hashed signature for the request
        schema:
          type: string
      - name: RecipientContactID
        in: query
        required: true
        description: The recipient contact ID
        schema:
          type: string
      - name: DeliveryMethodToken
        in: query
        required: true
        description: The token of the delivery method to be deleted
        schema:
          type: string
      - name: ClientAccountID
        in: query
        required: false
        description: The client account ID
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
