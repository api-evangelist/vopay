                    description: True if the request was successful, false if it failed
                    example: 'true'
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  ScheduledTransferID:
                    type: integer
                    description: The unique ID of the scheduled transfer that was just created. This ID should be saved as it is required order to look up the status information on the scheduled transfer.
                    example: '1122'
  /account/client-accounts/fund-transfer-withdraw/schedule:
    post:
      description: This endpoint is used to schedule a fund-transfer-withdraw between two client accounts.
      summary: account/client-accounts/fund-transfer-withdraw/schedule
      tags:
      - Client Account Transfer Endpoints
      operationId: ClientAccountFundTransferWithdrawSchedulePOST
      deprecated: false
      requestBody:
        $ref: '#/components/requestBodies/ClientAccountTransferWithdrawSchedulePOST'
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: 'true'
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  ScheduledTransferID:
                    type: integer
                    description: The unique ID of the scheduled transfer that was just created. This ID should be saved as it is required order to look up the status information on the scheduled transfer.
                    example: '1122'
  /account/client-accounts/transfer/schedule/cancel:
    post:
      description: This endpoint is used to cancel a scheduled client account transfer and all remaining payments belonging to that scheduled transfer. Only scheduled transfers with the status in progress can be cancelled.
      summary: account/client-accounts/transfer/schedule/cancel
      tags:
      - Client Account Transfer Endpoints
      operationId: ClientAccountTransferScheduleCancelPOST
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                ScheduledTransferID:
                  description: ID of the schedule transfer to cancel
                  type: integer
                  format: int32
              required:
              - AccountID
              - Key
              - Signature
              - ScheduledTransferID
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: 'true'
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  Status:
                    type: string
                    description: A message indicating the resulting scheduled transfer status.
                    example: cancelled
  /account/client-accounts/scheduled-transfers:
    get:
      description: "This endpoint is used to look up either the list of all scheduled client account transfers, or to list the details of a single scheduled client account transfer. \n\n If the value ScheduledTransferID is present, we only list the details of that scheduled client account transfer."
      summary: account/client-accounts/scheduled-transfers
      tags:
      - Client Account Transfer Endpoints
      operationId: ClientAccountScheduledTransfers
      deprecated: false
      parameters:
      - name: AccountID
        in: query
        required: true
        description: Your account ID
        schema:
          type: string
      - name: Key
        in: query
        required: true
        description: API key for the account
        schema:
          type: string
      - name: Signature
        in: query
        required: true
        description: Hashed signature for the request
        schema:
          type: string
      - name: ScheduledTransferID
        in: query
        required: false
        description: ID of the schedule transfer (if this value is present, we list the details of the scheduled tranfser)
        schema:
          type: integer
          format: int32
      - name: ClientAccountID
        in: query
        required: false
        description: The Client Account ID that the scheduled transactions belong to
        schema:
          type: string
          format: int32
      - name: StartDate
        in: query
        required: false
        description: Return Client account transfers scheduled for or after this date/time. Can be specified in YYYY-MM-DD format.
        schema:
          type: string
          format: date-time
      - name: EndDate
        in: query
        required: false
        description: Return Client account transfers scheduled for or before this date/time. Can be specified in YYYY-MM-DD format.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: 'true'
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  ScheduledClientAccountTransfers:
                    type: object
                    description: Collection of scheduled transfer info data
                    properties:
                      '0':
                        type: object
                        properties:
                          ID:
                            type: integer
                            description: Unique ID for the scheduled transfer
                            example: '15'
                          DebitorClientAccountID:
                            type: string
                            description: The debitor ClientAccountID
                            example: JohnSmith
                          RecipientClientAccountID:
                            type: string
                            description: The recipient ClientAccountID
                            example: AvaLovelace
                          RecipientClientAccountIDSplit:
                            type: string
                            description: The split details for the recipient client accounts
                            example: '[{"ClientAccountID":"client_account_id_1","Amount":"2"},{"ClientAccountID":"client_account_id_2","Amount":"2"}]'
                          Amount:
                            type: number
                            description: The amount of the scheduled transaction
                            example: '25.00'
                          TransferType:
                            type: string
                            description: The payment type of scheduled transfer; i.e., fund-transfer, transfer-withdraw or fund-transfer-withdraw
                            example: fund-transfer
                          ReverseOnFailure:
                            type: boolean
                            description: Instructions on whether or not the scheduled transfer should be reversed if it fails
                            example: 'true'
                          Frequency:
                            type: string
