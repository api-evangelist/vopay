                            example: '2020-01-01'
                          EndDate:
                            type: string
                            format: date
                            description: Date from which the transaction will end
                            example: '2021-01-01'
                          EndingAfterPayments:
                            type: integer
                            description: Number of payments after which the transaction processing will end
                            example: '12'
                          ScheduledDetails:
                            type: object
                            description: 'Array serialized as a JSON object (JSON_FORCE_OBJECT): numeric string keys ''0'',''1'',... Extra details of the scheduled transaction'
                            properties:
