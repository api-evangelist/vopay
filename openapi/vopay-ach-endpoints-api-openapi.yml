  /ach/void:
    post:
      description: This method is used to void a previously created ACH transaction. Note, you can only void a transaction if it has not yet settled. If the transaction has already settled, then you can use the /ach/refund endpoint to reverse the transaction.
      summary: ach/void
      tags:
      - ACH Endpoints
      operationId: ACHVoidPost
      deprecated: false
      requestBody:
        $ref: '#/components/requestBodies/CreditCardVoidPost'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: true
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  TransactionID:
                    type: integer
                    description: The unique ID for the void transaction
                    example: '1124'
                  TransactionStatus:
                    type: string
                    description: A message indicating the current transaction status - cancelled
                    example: cancelled
                  Timestamp:
                    type: string
                    description: The timestamp when the transaction status was last modified
                    example: '2022-02-04 12:34:56'
                required:
                - Success
                - ErrorMessage
                - TransactionID
                - TransactionStatus
                - Timestamp
  /ach/fund/transaction:
    get:
      description: This endpoint is used to look up and return the full details on a single ACH fund transaction.
      summary: ach/fund/transaction
      tags:
      - ACH Endpoints
      operationId: AchFundTransactionGet
      deprecated: false
      parameters:
      - name: AccountID
        in: query
        required: true
        description: Your account ID
        schema:
          type: string
      - name: Key
        in: query
        required: true
        description: API key for the account
        schema:
          type: string
      - name: Signature
        in: query
        required: true
        description: Hashed signature for the request
        schema:
          type: string
      - name: TransactionID
        in: query
        required: true
        description: The unique ID of the fund transaction
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: true
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  TransactionID:
                    type: integer
                    description: The unique ID of the transaction
                    example: '1122'
                  TransactionStatus:
                    type: string
                    description: 'A message indicating the current transaction status. Statuses are: pending, in progress, successful, failed, cancelled'
                    example: pending
                  TransactionDateTime:
                    type: string
                    format: date-time
                    description: The timestamp when the transaction was created
                    example: '2019-11-01 12:00:00'
                  HoldReleaseDateTime:
                    type: string
                    format: date-time
                    description: The timestamp when the transaction hold release will be released
                    example: '2019-11-01 12:00:00'
                  Amount:
                    type: number
                    description: The dollar amount of the fund transaction. This is the amount that was withdrawn from the customer's bank account.
                    example: '1200'
                  Currency:
                    type: string
                    description: The currency for the transaction.
                    example: CAD
                  HoldAmount:
                    type: number
                    description: Indicates if any of the funds that were credited to your account are still being held.
                    example: '1200'
                  LastModified:
                    type: string
                    format: date-time
                    description: This timestamp indicates when the transaction record was last modified. In normal circumstances the transaction record will only be modified when the status of the transaction changes or the HoldAmount is changed.
                    example: '2019-11-02 01:00:21'
                  CompanyName*:
                    type: string
                    description: Company's name
                    example: VoPay
                  FirstName*:
                    type: string
                    description: Customer's first name
                    example: John
                  LastName*:
                    type: string
                    description: Customer's last name
                    example: Doe
                  Address1:
                    type: string
                    description: Customer's address line 1
                    example: 112 Bentall Street
                  Address2:
                    type: string
                    description: Customer's address line 2
                    example: ''
                  City:
                    type: string
                    description: Customer's city
                    example: Vancouver
                  Province/State:
                    type: string
                    description: Customer's province specified using two character abbreviation (eg. BC, AB)
                    example: BC
                  Country:
                    type: string
                    description: Customer's Country specified using full country name or ISO 3166-1 alpha-2 code
                    example: Canada
                  PostalCode/Zipcode:
                    type: string
                    description: Customer's postal code.
                    example: V4W 5Z7
                  AccountNumber:
                    type: string
                    description: Customer's bank account number that funds were debited from.
                    example: '1100456342'
                  ABARoutingNumber:
                    type: string
                    description: Routing number for the customer's account.
                    example: '129320349'
                  ClientReferenceNumber:
                    type: string
                    description: An optional reference number which was associated with the transaction.
                    example: '876432'
                  ScheduledTransactionID:
                    type: integer
                    description: Id of the scheduled transaction. This field only will be displayed if the scheduled transaction exists.
                    example: '1'
                  GLCode:
                    type: string
                    description: General ledger code.
                    example: '4300'
                  TransactionTypeCode:
                    type: string
                    description: CPA transaction code.
                    example: '999'
                required:
                - Success
                - ErrorMessage
                - TransactionID
                - TransactionStatus
                - TransactionDateTime
                - HoldReleaseDateTime
                - Amount
                - Currency
                - HoldAmount
                - LastModified
                - CompanyName*
                - FirstName*
                - LastName*
                - Address1
                - Address2
                - City
                - Province/State
                - Country
                - PostalCode/Zipcode
                - AccountNumber
                - ABARoutingNumber
                - ClientReferenceNumber
                - ScheduledTransactionID
                - GLCode
                - TransactionTypeCode
  /ach/withdraw/transaction:
    get:
      description: This endpoint is used to look up details on a single ACH withdraw transaction. Withdraw transactions debit funds from your account and deposit them into the customer's bank account.
      summary: ach/withdraw/transaction
      tags:
      - ACH Endpoints
      operationId: AchWithdrawTransactionGet
      deprecated: false
      parameters:
      - name: AccountID
        in: query
        required: true
        description: Your account ID
        schema:
          type: string
      - name: Key
        in: query
        required: true
        description: API key for the account
        schema:
          type: string
      - name: Signature
        in: query
        required: true
        description: Hashed signature for the request
        schema:
          type: string
      - name: TransactionID
        in: query
        required: true
        description: Unique ID of the withdraw transaction
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: true
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  TransactionID:
                    type: integer
                    description: The unique ID of the transaction
                    example: '1122'
                  TransactionStatus:
                    type: string
                    description: 'A message indicating the current transaction status. Statuses are: pending, in progress, successful, failed, cancelled'
                    example: pending
                  TransactionDateTime:
                    type: string
                    format: date-time
                    description: The timestamp when the transaction was created
                    example: '2019-11-01 12:00:00'
                  Amount:
                    type: number
                    description: The dollar amount of the withdraw transaction. This is the amount to be deposited into the recipient's bank account.
                    example: '2000'
                  Currency:
                    type: string
                    description: The currency for the transaction.
                    example: USD
                  HoldAmount:
                    type: number
                    description: Will always be 0 for withdraw transactions, however parameter is included to keep return data format consistent with the format used for fund transactions.
                    example: '2000'
                  LastModified:
                    type: string
                    format: date-time
                    description: This timestamp indicates when the transaction record was last modified. In normal circumstances withdraw transaction record will not be modified.
                    example: '2019-11-03 01:00:00'
                  CompanyName*:
                    type: string
                    description: Company's name
                    example: VoPay
                  FirstName*:
                    type: string
                    description: Recipient's first name
                    example: John
                  LastName:
                    type: string
                    description: Recipient's last name
                    example: Doe
                  PhoneNumber:
                    type: integer
                    description: Recipient's phone number
                    example: 604556****
                  Address1:
                    type: string
                    description: Recipient's address line 1
                    example: 112 Bentall Street
                  Address2:
                    type: string
                    description: Recipient's address line 2
                    example: ''
                  City:
                    type: string
                    description: Recipient's city
                    example: Los Angeles
                  Province/State:
                    type: string
                    description: Recipient's province or state specified using two character abbreviation (eg. BC, AB)
                    example: CA
                  Country:
                    type: string
                    description: Recipient's country specified using full country name.
                    example: USA
                  PostalCode/ZipCode:
                    type: string
                    description: Recipient's postal or zip code.
                    example: '90210'
                  AccountNumber:
                    type: string
                    description: Recipient's bank account number that funds were deposited to.
                    example: '227654387'
                  ABARoutingNumber:
                    type: string
                    description: Routing number for the customer's account.
                    example: '129320349'
                  ClientReferenceNumber:
                    type: string
                    description: An optional reference number which was associated with the transaction.
                    example: ''
                  GLCode:
                    type: string
                    description: General ledger code.
                    example: '4300'
                  TransactionTypeCode:
                    type: string
                    description: CPA transaction code.
                    example: '999'
                required:
                - Success
                - ErrorMessage
                - TransactionID
                - TransactionStatus
                - TransactionDateTime
                - Amount
                - Currency
                - HoldAmount
                - LastModified
                - CompanyName*
                - FirstName*
                - LastName
                - PhoneNumber
                - Address1
                - Address2
                - City
                - Province/State
                - Country
                - PostalCode/ZipCode
                - AccountNumber
                - ABARoutingNumber
                - ClientReferenceNumber
                - GLCode
                - TransactionTypeCode
  /ach/scheduled-transactions:
    get:
      description: "This endpoint is used to look up the list of all scheduled transactions, or you can list the details of a single scheduled transaction. \n\n If the value ScheduledTransactionID is present, we only list the details of that scheduled transaction.  \n\n * Either the response will be Company name or First name and Last name"
