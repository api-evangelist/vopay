  /ach/failures:
    get:
      description: This endpoint is used to retrieve a list of transactions which failed during a specific date range. This endpoint is queried based on the date that a failure occurred on, not on the date when the transaction originally occurred.
      summary: ach/failures
      tags:
      - ACH Endpoints
      operationId: AchFailuresGet
      deprecated: false
      parameters:
      - name: AccountID
        in: query
        required: true
        description: Your account ID
        schema:
          type: string
      - name: Key
        in: query
        required: true
        description: API key for the account
        schema:
          type: string
      - name: Signature
        in: query
        required: true
        description: Hashed signature for the request
        schema:
          type: string
      - name: StartDateTime
        in: query
        required: true
        description: Start of date range to query for any failed transactions
        schema:
          type: string
          format: date-time
      - name: EndDateTime
        in: query
        required: true
        description: End of date range to query for any failed transactions
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: true
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  NumberOfRecords:
                    type: number
                    description: Total number of failed transaction records returned
                    example: '1'
                  FailedTransactions:
                    type: object
                    description: 'Array serialized as a JSON object (JSON_FORCE_OBJECT): numeric string keys ''0'',''1'',... Collection of TransactionInfo data'
                    properties:
                      '0':
                        type: object
                        properties:
                          TransactionID:
                            type: integer
                            description: Unique ID for the Transaction
                            example: '5918'
                          TransactionDateTime:
                            type: string
                            format: date-time
                            description: The timestamp on which the transaction occurred.
                            example: '2019-12-04 18:13:39'
                          TransactionType:
                            type: string
                            description: Specifies the type of transaction, for example 'ACH Funding', 'ACH Withdrawal'.
                            example: ACH Funding
                          DollarAmount:
                            type: number
                            description: The dollar amount of the failed transaction.
                            example: '25.00'
                          ErrorCode:
                            type: string
                            description: Detail error code of the failure.
                            example: R01
                          FailureReason:
                            type: string
                            description: Detailed description of why the transaction failed. Transactions which have failed cannot be modified, a new fund or withdraw transaction must be created if you wish to re-attempt the transaction.
                            example: insufficient funds
                          ClientReferenceNumber:
                            type: string
                            description: The optional reference number which was set when the transaction was created.
                            example: 'null'
                        required:
                        - TransactionID
                        - TransactionDateTime
                        - TransactionType
                        - DollarAmount
                        - ErrorCode
                        - FailureReason
                        - ClientReferenceNumber
                    x-empty-when: no failed transactions match
                    x-list-of: inline
                required:
                - Success
                - ErrorMessage
                - NumberOfRecords
                - FailedTransactions
  /ach/validate-nacha:
    post:
      description: This endpoint is used to trigger a NACHA validation on the provided bank account. In the endpoint below, either Token or ABARoutingNumber/AccountNumber are required. Either a CompanyName OR FirstName and LastName must be provided.
      summary: ach/validate-nacha
      tags:
      - ACH Endpoints
      operationId: AchValidateNachaPost
      deprecated: false
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                Token:
                  description: Your iQ11 Token that has been generated using Custom Iframe. This can be provided in lieu of a routing number and account number.
                  type: string
                ABARoutingNumber:
                  description: ABA routing number for customer's US bank account. This can be provided in lieu of a token.
                  type: integer
                AccountNumber:
                  description: Customer's bank account number for transaction code. This can be provided in lieu of a token.
                  type: integer
                CompanyName:
                  description: Company's name. This can be provided in lieu of first name and last name.
                  type: string
                FirstName:
                  description: Customer's first name. This can be provided in lieu of a company name.
                  type: string
                LastName:
                  description: Customer's last name. This can be provided in lieu of a company name.
                  type: string
                PhoneNumber:
                  description: Customer's phone number. Digits only - no parentheses or dashes allowed.
                  type: string
                Address:
                  description: Customer's civic number and street name (eg. 123 Main Street)
                  type: string
                City:
                  description: Customer's city
                  type: string
                State:
                  description: Customer's state specified using two character abbreviations (eg. CA, AZ)
                  type: string
                ZipCode:
                  type: string
              required:
              - AccountID
              - Key
              - Signature
              - Token
              - ABARoutingNumber
              - AccountNumber
              - CompanyName
              - FirstName
              - LastName
              - PhoneNumber
              - Address
              - City
              - State
              - ZipCode
        required: true
      responses:
        '200':
          description: Response indicating the result of the NACHA validation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: true
                  ErrorMessage:
                    type: string
                    description: ''
                    example: ''
                  ValidationResult:
                    type: string
                    description: 'The result of the NACHA validation. Possible values are: verified or failed.'
                    example: verified
                required:
                - Success
                - ErrorMessage
                - ValidationResult
components:
  requestBodies:
    CreditCardVoidPost:
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              AccountID:
                description: Your account ID
                type: string
              Key:
                description: API key for the account
                type: string
              Signature:
                description: Hashed signature for the request
                type: string
              TransactionID:
                description: The unique ID for the transaction you want to void
                type: integer
            required:
            - AccountID
            - Key
            - Signature
            - TransactionID
      required: true
