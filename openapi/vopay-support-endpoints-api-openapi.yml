components:
  requestBodies:
    submitTicketAttachmentPOST:
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            properties:
              AccountID:
                description: Your account ID
                type: string
              Key:
                description: API key for the account
                type: string
              Signature:
                description: Hashed signature for the request
                type: string
              TicketAttachment:
                description: Base64 code of the attachment content
                type: string
              TicketID:
                description: The ID of the ticket
                type: string
              AttachmentFileName:
                description: The name of the file being attached. It defaults to attachment if the name is not provided.
                type: string
            required:
            - AccountID
            - Key
            - Signature
            - TicketAttachment
            - TicketID
      required: true
    submitTicketCommentPOST:
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
