              AccountID:
                description: Your account ID
                type: string
              Key:
                description: API key for the account
                type: string
              Signature:
                description: Hashed signature for the request
                type: string
              TicketAuthor:
                description: The full name of the submitter of your ticket
                type: string
              TicketComment:
                description: Comment
                type: string
              TicketID:
                description: The ID of the ticket
                type: string
            required:
            - AccountID
            - Key
            - Signature
            - TicketAuthor
            - TicketComment
            - TicketID
      required: true
