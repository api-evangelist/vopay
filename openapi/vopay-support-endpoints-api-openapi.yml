                          id:
                            type: string
                            description: ID of the ticket.
                            example: ''
                          subject:
                            type: string
                            description: The subject of the ticket.
                            example: ''
                          status:
                            type: string
                            description: The status of the ticket.
                            example: ''
                          dateAdded:
                            type: string
