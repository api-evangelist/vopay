  /google-pay/charge:
    post:
      description: "This endpoint is to create a Google Pay transaction to fund your VoPay account, charging the amount specified to the card linked to the provided Google Pay Token.\n\n If a ClientAccountID is provided, the client account's default Google Pay wallet will be used for the transaction.\n\nNote: You must first generate a GooglePayToken using the /google-pay/generate-embed-url endpoint."
      summary: google-pay/charge
      tags:
      - Digital Wallet Endpoints
      operationId: GooglePayChargePOST
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                ClientAccountID:
                  description: Client Account ID
                  type: string
                ContactID:
                  description: The ID of the contact to use for this transaction. The contacts payment method associated with this transaction type will be used.
                  type: string
                GooglePayToken:
                  description: The token identifying the Google Pay wallet to charge (returned from /google-pay/generate-embed-url).
                  type: string
                Amount:
                  description: The amount to charge from the customer's Google Pay wallet.
                  type: number
                Currency:
                  description: 3 character currency code for the currency to be charged to the customer's Google Pay wallet. If this is not specified the transaction will use the account's local currency.
                  type: string
                Country:
                  description: Customer's country specified using full country name or ISO 3166-1 alpha-2 code. If this is not specified the transaction will use the local country.
                  type: string
                IdempotencyKey:
                  description: A unique key which the server can use to recognize and reject subsequent retries of the same request.
                  type: string
                GLCode:
                  description: An optional unique identification general ledger code.
                  type: string
                TransactionTypeCode:
                  description: CPA transaction code. Use the /api/v2/account/transactions/codes endpoint to retrieve a list of valid transaction codes. If not specified, the transaction will be created using code 450 (miscellaneous).
                  type: string
              required:
              - AccountID
              - Key
              - Signature
              - GooglePayToken
              - Amount
