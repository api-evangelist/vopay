        description: Transaction settlement date
        schema:
          type: string
      - name: Status
        in: query
        required: false
        description: The transaction status.
        schema:
          type: string
      - name: Currency
        in: query
        required: false
        description: The transaction currency.
        schema:
          type: string
      - name: TransactionID
        in: query
        required: false
        description: The transaction ID
        schema:
          type: string
      - name: Limit
        in: query
        required: false
        description: Limit the number of records that are returned. Use the off-set parameter to set the starting point in the data-set.
        schema:
          type: integer
      - name: Offset
        in: query
        required: false
        description: Use this parameter to set the starting point in the dataset.
        schema:
          type: integer
      - name: IncludeSubaccountTransactions
        in: query
        required: false
        description: Fetch transactions for subaccounts as well.
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: true
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  TransactionsCount:
                    type: number
                    description: Total number of all the transactions
                    example: ''
                    x-absent-when: ExportCSV requested
                  Transactions:
                    type: string
                    description: JSON object containing all the transactions
                    example: '{''TransactionID'': ''TransactionID'', ''TransactionType'': ''TransactionType''}'
                    x-absent-when: ExportCSV requested
                  Pagination:
                    type: object
                    description: Pagination metadata
                    properties:
                      TotalRecords:
                        type: string
                        description: Total number of sub account records in that search range.
                        example: '1000'
                      Offset:
                        type: string
                        description: Use this parameter to set the starting point in the dataset.
                        example: '1000'
                      Limit:
                        type: string
                        description: Limit the number of records that are returned.
                        example: '1000'
                    required:
                    - TotalRecords
                    - Offset
                    - Limit
                required:
                - Success
                - ErrorMessage
                - Pagination
  /partner/account/transfer:
    post:
      description: This endpoint allows you to transfer funds between VoPay accounts.
      summary: partner/account/transfer
      tags:
      - Partner Endpoints
      operationId: PartnerAccountTransferPost
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                DebitorAccountID:
                  description: ID of the account transferring the funds
                  type: string
                RecipientAccountID:
                  description: ID of the account receiving the funds
                  type: string
                Amount:
                  description: The transfer amount.
                  type: number
                Currency:
                  description: 3 character currency code for the currency to fetch transactions for. If this is not specified the transaction will use the account's local currency (generally CAD).
                  type: string
                ClientReferenceNumber:
                  description: An optional reference number to associate with the transfer
                  type: string
                Notes:
                  description: An optional note to associate with the transaction.
                  type: string
                IdempotencyKey:
                  description: A unique key which the server can use to recognize and reject subsequent retries of the same request.
                  type: string
              required:
              - AccountID
              - Key
              - Signature
              - DebitorAccountID
              - RecipientAccountID
              - Amount
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: true
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  TransactionID:
                    type: integer
                    description: The unique ID of the debit transaction associated with this transfer.
                    example: '11223344'
                required:
                - Success
                - ErrorMessage
                - TransactionID
