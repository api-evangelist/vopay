                                            example: '20'
                                          Occupation:
                                            type: string
                                            description: Shareholder's occupation
                                            example: ''
                                          HomeAddress:
                                            type: string
                                            description: Shareholder's home address
                                            example: 123 address st, Vancouver
                                          DateAdded:
                                            type: string
                                            format: date
                                            description: ''
                                            example: '2019-11-03 01:00:00'
