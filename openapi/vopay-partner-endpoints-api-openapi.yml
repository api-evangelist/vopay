                                    x-list-of: inline
                                    x-empty-when: no items
                                  ShareHolders:
                                    type: object
                                    description: 'Array serialized as a JSON object (JSON_FORCE_OBJECT): numeric string keys ''0'',''1'',... Empty {} when no items.'
                                    properties:
                                      '0':
