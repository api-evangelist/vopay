      summary: partner/create-partner
      tags:
      - Partner Endpoints
      operationId: PartnerCreatePartnerPost
      deprecated: false
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                AccountID:
                  description: Your account ID
                  type: string
                Key:
                  description: API key for the account
                  type: string
                Signature:
                  description: Hashed signature for the request
                  type: string
                Name:
                  description: Name of the partner account to create
                  type: string
                EmailAddress:
                  description: Email address for the new partner account
                  type: string
                  format: email
                Country:
                  description: Country for the new partner account. ISO abbreviation or full country name
                  type: string
                PartnerAccountID:
                  description: The ID of the partner account to create. If not specified, the system will generate a random unique ID for the new partner account.
                  type: string
              required:
              - AccountID
              - Key
              - Signature
              - Name
              - EmailAddress
              - Country
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  Success:
                    type: boolean
                    description: True if the request was successful, false if it failed
                    example: true
                  ErrorMessage:
                    type: string
                    description: Contains a description of the error if the request failed
                    example: ''
                  PartnerAccountID:
                    type: string
                    description: The unique ID for the newly created partner account
                    example: PartnerAccount123
                  APIKey:
                    type: string
                    description: The API key for the new partner account
                    example: eddc0f5e37d20f98b486daf842447ec1f225f859
                  APISharedSecret:
                    type: string
                    description: API Shared Secret for the new partner account
                    example: AbcDefGi+KlmnopQRSTu183==
                required:
                - Success
                - ErrorMessage
                - PartnerAccountID
                - APIKey
                - APISharedSecret
