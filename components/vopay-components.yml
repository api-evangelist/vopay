description: >-
  VoPay ships hosted, embeddable connection and verification experiences delivered as
  iFrames. A backend *GenerateEmbedURL endpoint returns a URL that the client embeds; the
  end user completes bank/card connection or account verification inside VoPay-hosted UI,
  and the resulting token/status is delivered back by webhook.
